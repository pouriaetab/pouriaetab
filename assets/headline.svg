<svg xmlns="http://www.w3.org/2000/svg" width="720" height="80" viewBox="0 0 720 80" role="img" aria-label="Statistics · Data Science · Business · Product / Turning messy data into clear decisions / Automation and lightweight web apps / Every number ships with its method and uncertainty"><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:22px;font-weight:500;fill:#58A6FF;text-anchor:middle;dominant-baseline:middle;opacity:0}
.l{animation:cycle 14.0s cubic-bezier(.22,.61,.36,1) infinite}
